[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blocksvibe"
version = "0.1.0"
description = "blocks_3d's conformal-block computation on GPUs (batched multiprecision recursion), blocks_3d-compatible output"
requires-python = ">=3.10"
# multiprecision GPU arithmetic (mpf, rns) from SDPviBe; cupy must match the CUDA version
dependencies = ["sdpvibe", "torch", "numpy", "mpmath"]

[project.scripts]
blocksvibe = "blocksvibe.cli:main"

[tool.setuptools]
packages = ["blocksvibe"]
